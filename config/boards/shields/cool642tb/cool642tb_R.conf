# ===================================================
# ユーザー設定
# ===================================================
CONFIG_ZMK_KEYBOARD_NAME="cool642tb"
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ===================================================
# ハードウェア設定 (センサー、エンコーダー等)
# ===================================================
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- PMW3610 トラックボールセンサー設定 ---
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=500
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=1

# --- 1. Bluetooth 接続パラメータ（維持）---
# 応答性の高さは維持するため、前回の低遅延設定はそのまま使います。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# --- 2. スレーブレイテンシを許容する ---
# 新しいデータがない場合、キーボードが数回の通信機会をスキップできるようにします。
# これもホストの負荷を軽減し、安定性を向上させる効果があります。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200

# --- 3. センサーのポーリングレートを制限（維持） ---
# データ生成のペースを抑えるため、この設定は有効のままにします。
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# --- 4. 送信電力の最大化（維持）---
# 物理的な電波強度を確保するため、これは有効のままにします。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- 4. 省電力機能（ラグ診断用） ---
# ラグの原因がスリープ機能にあるかを切り分けるため、一時的に無効化します。
# これで問題が解決する場合、スリープ設定が原因です。
# バッテリー消費は増えるため、問題が解決したら再度有効化を検討してください。
# CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SLEEP=y

# --- 5. デバウンス設定 ---
# 応答性を少しでも高めるため、推奨される最小値に設定します。ZMK公式の推奨は5msです
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
